name: gab-unresolvable
on:
  push:
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  sentinel:
    runs-on: ubuntu-latest
    steps:
      - name: sentinel
        env:
          S: ${{ secrets.GAB_SENTINEL_SECRET }}
        run: |
          if [ -n "$S" ]; then echo SENTINEL_SAW_SECRET; else echo SENTINEL_NO_SECRET; fi

  call-unresolvable:
    needs: sentinel
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && contains(github.event.comment.body, 'retest'))
    uses: Adobe-Enterprise-Docs/workflows/.github/workflows/validate-articles.yml@main
    with:
      debug: true
    secrets:
      SCCM_GITHUB_APP_ID: ${{ secrets.SCCM_GITHUB_APP_ID }}
      SCCM_GITHUB_APP_PRIVATE_KEY: ${{ secrets.SCCM_GITHUB_APP_PRIVATE_KEY }}
