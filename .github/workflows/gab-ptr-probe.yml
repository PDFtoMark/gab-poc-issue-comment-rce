name: gab-ptr-probe
on:
  pull_request_target:
    types: [opened]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          SEC: ${{ secrets.JIRA_SYNC_API_TOKEN }}
        run: |
          echo "event=${{ github.event_name }} action=${{ github.event.action }}"
          echo "head=${{ github.event.pull_request.head.label }}"
          echo "title=${{ github.event.pull_request.title }}"
          if [ -n "$SEC" ]; then echo "secret_present=yes"; else echo "secret_present=no"; fi
