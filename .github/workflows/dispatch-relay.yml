name: Mention Trigger Relay
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
permissions:
  contents: write
jobs:
  dispatch:
    if: contains(github.event.comment.body, '@AgentTed')
    runs-on: ubuntu-latest
    steps:
      - name: Send Payload
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'mention_trigger',
              client_payload: {
                comment_body: context.payload.comment.body,
                author: context.payload.comment.user.login,
                html_url: context.payload.comment.html_url,
                issue_title: context.payload.issue?.title || ''
              }
            });
