name: Claude Code PR Review Real
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude-review:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    uses: auth0/auth0-ai-pr-analyzer-gh-action/.github/workflows/claude-code-review.yml@main
    with:
      custom_review_instructions: ${{ inputs.custom_review_instructions }}
      prompt: ${{ inputs.prompt }}
      prompt_file: ${{ inputs.prompt_file }}
      allowed_tools: ${{ inputs.allowed_tools }}
      disallowed_tools: ${{ inputs.disallowed_tools }}
