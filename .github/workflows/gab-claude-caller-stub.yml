name: Claude Code PR Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude-review:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/gab-claude-rw-stub.yml
    with:
      custom_review_instructions: ${{ inputs.custom_review_instructions }}
      prompt: ${{ inputs.prompt }}
      prompt_file: ${{ inputs.prompt_file }}
      allowed_tools: ${{ inputs.allowed_tools }}
      disallowed_tools: ${{ inputs.disallowed_tools }}
